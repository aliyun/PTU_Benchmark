[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptu-benchmark"
version = "1.0.0"
description = "Benchmark suite for Alibaba Cloud Model Studio PTU (Provisioned Throughput Unit) performance testing"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Alibaba Cloud International", email = "solutions@alibabacloud.com"},
]
dependencies = [
    "openai==2.41.0",
    "aiohttp==3.14.4",
    "numpy==2.4.6",
    "python-dotenv==1.2.2",
    "tabulate==0.10.0",
    "pyyaml==6.0.3",
    "matplotlib==3.10.9",
    "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "aioresponses==0.7.9",
    "ruff==0.15.21",
    "mypy==2.2.0",
]

[project.scripts]
ptu-benchmark = "ptu_benchmark.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
