[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptu-benchmark"
version = "1.0.0"
description = "Benchmark suite for Alibaba Cloud Model Studio PTU (Provisioned Throughput Unit) performance testing"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Alibaba Cloud International", email = "solutions@alibabacloud.com"},
]
dependencies = [
    "openai>=1.0.0",
    "aiohttp>=3.9.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
ptu-benchmark = "ptu_benchmark.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
